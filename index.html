<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louis Roy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: #1a1d23;
            position: relative;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #d0d6e0;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            mix-blend-mode: screen;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #2a6dd9 0%, #1a4fa8 100%);
            top: -10%;
            left: -10%;
            animation: float-1 20s ease-in-out infinite;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            top: 50%;
            right: -5%;
            animation: float-2 18s ease-in-out infinite;
        }

        .blob-3 {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            bottom: -15%;
            left: 30%;
            animation: float-3 22s ease-in-out infinite;
        }

        @keyframes float-1 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, 150px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 100px) scale(0.9);
            }
        }

        @keyframes float-2 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(-120px, -80px) scale(0.95);
            }
            66% {
                transform: translate(80px, 120px) scale(1.05);
            }
        }

        @keyframes float-3 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(-80px, -100px) scale(1.08);
            }
            66% {
                transform: translate(120px, 50px) scale(0.92);
            }
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }
        
        .intro {
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            color: #e8edf5;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: normal;
            margin-bottom: 1.5rem;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #9ba8bc;
        }
        
        .contact {
            margin-top: 2.5rem;
            font-weight: 500;
        }
        
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="container">
        <p class="intro">👋&nbsp;&nbsp;Hi there!</p>

        <h1>My name is Louis and <strong>I build mobile and web applications from idea to launch</strong></h1>
        
        <p class="contact"><strong>Let's talk about your project:</strong> <a href="mailto:louisroy@louisroy.net">louisroy@louisroy.net</a></p>
    </div>
</body>
</html>
